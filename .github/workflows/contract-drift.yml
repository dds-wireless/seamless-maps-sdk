# ADR-053 decision 2 wants the committed contract diffed against the document
# production actually serves. That cannot run on a GitHub-hosted runner: the
# gateway resolves publicly but is IP-allowlisted, so a runner's fetch fails at
# the network layer regardless of the contract's contents.
#
# So this is **manual only**. `make drift` does the same thing from a machine
# inside the allowlist, which is where it currently has to happen. Restoring the
# schedule - or putting the job back in ci.yml - needs one of: a self-hosted
# runner inside the perimeter, a narrowly allowlisted CI egress address, or the
# document served from somewhere publicly reachable.
#
# `GET /openapi.json` itself needs no credential (ADR-052 decision 4); reachability
# is the only obstacle.
name: contract-drift

on:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: Gateway to diff against
        default: https://seamlessmaps-api.ddswireless.net

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Diff the committed contract against the one production serves
        env:
          SEAMLESS_GATEWAY_URL: ${{ inputs.gateway_url || vars.SEAMLESS_GATEWAY_URL }}
        run: node scripts/check-contract-drift.mjs
