# The scheduled half of ADR-053 decision 2.
#
# `ci.yml` runs the same check on every pull request, which catches *us* changing
# the committed contract. This one catches *production* changing underneath it -
# a gateway deploy that alters the document while nobody happens to be opening a
# PR. Same script, different trigger; neither makes the other redundant.
#
# `GET /openapi.json` is unauthenticated (ADR-052 decision 4), so this needs no secret.
name: contract-drift

on:
  schedule: [{ cron: '17 6 * * 1-5' }]
  workflow_dispatch:
    inputs:
      gateway_url:
        description: Gateway to diff against
        default: https://seamlessmaps-api.ddswireless.net

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Diff the committed contract against the one production serves
        env:
          SEAMLESS_GATEWAY_URL: ${{ inputs.gateway_url || vars.SEAMLESS_GATEWAY_URL }}
        run: node scripts/check-contract-drift.mjs
