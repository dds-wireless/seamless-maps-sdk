name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Build before test: the suite smoke-tests the published artifacts from dist/,
      # because a build that typechecks and does not load is what reaches customers.
      - run: pnpm build
      - run: pnpm test
      - run: make audit

  # ADR-053 decision 2: drift is caught against production, not against a file.
  # This repository is not co-located with the gateway, so the only thing that can
  # keep the committed contract honest is the document customers actually receive.
  # `GET /openapi.json` is unauthenticated (ADR-052 decision 4), so this needs no
  # secret and is safe on a fork's pull request.
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Diff the committed contract against the one production serves
        env:
          SEAMLESS_GATEWAY_URL: ${{ vars.SEAMLESS_GATEWAY_URL }}
        run: node scripts/check-contract-drift.mjs

  generated-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:types
      - name: src/generated must match openapi.json
        run: git diff --exit-code -- src/generated
